<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
  <!-- Source for the store's 1400x560 marquee promo tile. Palette and mark
       are the popup's own tokens; the mark is icon.svg scaled 1.75x.

       The file is square because the rasterizer (macOS QuickLook,
       qlmanage) crops a non-square viewBox. The marquee is the centred
       560-tall band (y 420..980). The magenta frame is a registration
       mark: QuickLook scales by an unreported factor, so find the frame's
       bounding box to locate the square. It never reaches the output.

       Rebuild:
         qlmanage -t -s 2048 -o OUT assets/promo-marquee.svg
         S/X/Y = bbox of #FF00FF in OUT/promo-marquee.svg.png
         crop  SxROUND(S*0.4) +X +(Y+ROUND(S*0.3)), then -resize 1400x560! -->
  <defs>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FA2B8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4FA2B8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="1400" fill="#141618"/>
  <ellipse cx="560" cy="700" rx="560" ry="330" fill="url(#bloom)"/>
  <g transform="translate(325,588) scale(1.75)">
    <rect width="128" height="128" rx="28" fill="#15171a"/>
    <path d="M46 32.8 A36 36 0 1 0 82 32.8" fill="none" stroke="#4FA2B8"
          stroke-width="13" stroke-linecap="round"/>
    <path d="M65.5 23.3 L79.5 48.1 L94.1 22.9 Z" fill="#4FA2B8"/>
  </g>
  <text x="609" y="712" font-family="Menlo, ui-monospace, monospace"
        font-size="108" font-weight="600" letter-spacing="-3" fill="#e9eaec">revert<tspan fill="#4FA2B8">X</tspan></text>
  <text x="609" y="770" font-family="Menlo, ui-monospace, monospace"
        font-size="31" letter-spacing="-0.3" fill="#98a0a8">Puts back what X removed.</text>
  <rect x="1" y="1" width="1398" height="1398" fill="none" stroke="#FF00FF" stroke-width="2"/>
</svg>
