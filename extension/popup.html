<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>revertX</title>
  <link rel="stylesheet" href="dist/popup.css">
</head>
<body>
  <header>
    <h1 class="wordmark">revert<span class="tld">X</span></h1>
  </header>

  <section>
    <label class="row select-row">
      <span>Media tab opens</span>
      <select id="mediaview">
        <option value="photos">Photo grid</option>
        <option value="mosaic">Mosaic</option>
        <option value="videos">Videos</option>
      </select>
    </label>
    <p class="hint" id="mosaic-note" hidden>Mosaic loads more photos as
      you scroll. X limits how much an account can load at once, so on
      long profiles loading can pause for a few minutes. The view says
      when it continues.</p>
    <label class="row">
      <input type="checkbox" id="likestab" checked>
      <span>Likes tab on your profile</span>
    </label>
    <p class="warn" id="likestab-warn" hidden>X no longer ships this layout.</p>
    <label class="row">
      <input type="checkbox" id="postgrid">
      <span>Photo grid in posts</span>
    </label>
    <p class="warn" id="postgrid-warn" hidden>X no longer ships this layout.</p>
    <label class="row">
      <input type="checkbox" id="sharecopy" checked>
      <span>Copy link first in the share menu</span>
    </label>

    <p class="note">Reload to apply changes</p>
  </section>

  <script src="dist/popup.js"></script>
</body>
</html>
